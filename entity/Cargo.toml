[package]
name = "entity"
version = "0.2.0"
edition = "2021"
publish = false

[lib]
name = "entity"
path = "src/lib.rs"

[dependencies]
axum-login = "0.18"
sea-orm = { version = "2.0" }
serde-email = { version = "3.2", features = ["sea-orm"] }
strum = "0.28"
uuid = { version = "1.13", features = ["v4"] }

[dependencies.serde]
version = "1"
features = ["derive"]
